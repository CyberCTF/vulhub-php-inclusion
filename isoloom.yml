# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# PHP LFI with phpinfo() (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's php/inclusion, vendored in build/php/app/: the published image
# vulhub/php:7.1.3-apache with the www folder copied in.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-php-inclusion

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.239.0/24, internet: false}

machines:
  php:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 80
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/php

checks:
  - name: the web server answers
    http: http://php/phpinfo.php
    wait: 60
  - name: lfi.php includes a local file
    script: checks/lfi.sh
    wait: 60

message: |
  A PHP site answers at {{ machines.php.ports.web.url }}lfi.php?file=/etc/passwd; there is also a phpinfo.php.
  Where do uploaded files go before a script runs, and for how long?
