# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# PHP LFI with phpinfo() (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's php/inclusion, vendored in build/php/app/: the published image
# vulhub/php:7.1.3-apache with the www folder copied in.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-php-inclusion

networks:
  lab: { cidr: 10.60.239.0/24, internet: false }

machines:
  php:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 8080 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: build/php

checks:
  - name: the web server answers
    http: http://php/phpinfo.php
    wait: 60
  - name: lfi.php includes a local file
    script: checks/lfi.sh
    wait: 60

message: |
  A PHP site answers at http://localhost:{{ machines.php.services.0.publish }}/lfi.php?file=/etc/passwd; there is also a phpinfo.php.
  Where do uploaded files go before a script runs, and for how long?
